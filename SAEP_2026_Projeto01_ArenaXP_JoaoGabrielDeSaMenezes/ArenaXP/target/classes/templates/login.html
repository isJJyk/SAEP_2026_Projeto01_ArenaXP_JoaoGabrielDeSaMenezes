<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="login-body">
<main class="login-card">
    <h1 class="marca marca-grande">Arena<span>XP</span></h1>
    <p class="subtitulo">Gestão de Equipamentos E-Sports</p>

    <div class="alerta alerta-erro" role="alert" th:if="${erro != null}" th:text="${erro}">E-mail ou senha inválidos.</div>
    <div class="alerta alerta-sucesso" role="status" th:if="${sucesso != null}" th:text="${sucesso}">Sessão encerrada.</div>

    <form th:action="@{/login}" method="post" class="form">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" th:value="${email}" placeholder="voce@arenaxp.com" required autofocus>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Sua senha" required>

        <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
    </form>
</main>
</body>
</html>
