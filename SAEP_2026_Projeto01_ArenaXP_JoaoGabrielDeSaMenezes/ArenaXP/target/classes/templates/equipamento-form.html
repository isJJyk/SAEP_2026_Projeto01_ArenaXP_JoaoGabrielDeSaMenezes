<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicao} ? 'Editar equipamento' : 'Novo equipamento')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo('equipamentos')}"></header>

<main class="conteudo conteudo-estreito">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <h1 th:text="${modoEdicao} ? 'Editar equipamento' : 'Novo equipamento'">Novo equipamento</h1>

    <form class="form form-card"
          th:action="${modoEdicao} ? @{/equipamentos/{id}(id=${equipamentoId})} : @{/equipamentos}"
          method="post">

        <label for="codigoPatrimonio">Código de patrimônio</label>
        <input type="text" id="codigoPatrimonio" name="codigoPatrimonio" maxlength="30" required
               placeholder="Ex.: AXP-MSE-001" th:value="${equipamento.codigoPatrimonio()}">

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="120" required
               placeholder="Ex.: Mouse Gamer Ultraleve" th:value="${equipamento.nome()}">

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" name="categoria" maxlength="50" required list="listaCategorias"
               placeholder="Mouse, Teclado, Headset, Monitor, Captura..." th:value="${equipamento.categoria()}">
        <datalist id="listaCategorias">
            <option th:each="c : ${categorias}" th:value="${c}"></option>
        </datalist>

        <label for="especificacaoTecnica">Especificação técnica</label>
        <input type="text" id="especificacaoTecnica" name="especificacaoTecnica" maxlength="255" required
               placeholder="Ex.: 8000Hz Wireless" th:value="${equipamento.especificacaoTecnica()}">

        <div class="duas-colunas">
            <div>
                <label for="quantidadeAtual">Quantidade atual</label>
                <input type="number" id="quantidadeAtual" name="quantidadeAtual" min="0" step="1" required
                       th:value="${equipamento.quantidadeAtual()}">
            </div>
            <div>
                <label for="estoqueMinimo">Estoque mínimo</label>
                <input type="number" id="estoqueMinimo" name="estoqueMinimo" min="0" step="1" required
                       th:value="${equipamento.estoqueMinimo()}">
            </div>
        </div>

        <div class="form-botoes">
            <button type="submit" class="btn btn-primario" th:text="${modoEdicao} ? 'Salvar alterações' : 'Cadastrar'">Salvar</button>
            <a class="btn btn-secundario" th:href="@{/equipamentos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
