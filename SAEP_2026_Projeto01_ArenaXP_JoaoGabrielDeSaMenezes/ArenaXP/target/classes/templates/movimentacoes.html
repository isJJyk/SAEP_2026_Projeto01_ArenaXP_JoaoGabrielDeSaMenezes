<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movimentações')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo('movimentacoes')}"></header>

<main class="conteudo">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="titulo-linha">
        <h1>Histórico de Movimentações</h1>
        <a class="btn btn-primario" th:href="@{/estoque}">+ Nova movimentação</a>
    </div>
    <p class="subtitulo">Mais recentes primeiro.</p>

    <div class="tabela-wrap">
        <table>
            <thead>
            <tr><th>Data/hora</th><th>Equipamento</th><th>Tipo</th><th>Qtd.</th><th>Observação</th><th>Técnico responsável</th></tr>
            </thead>
            <tbody>
            <tr th:each="m : ${movimentacoes}">
                <td th:text="${#temporals.format(m.dataHora(), 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                <td>
                    <span th:text="${m.equipamentoNome()}">Equipamento</span>
                    <small class="cinza" th:text="${m.codigoPatrimonio()}">AXP-000</small>
                </td>
                <td>
                    <span class="badge badge-entrada" th:if="${m.tipoMovimentacao() == 'ENTRADA'}">ENTRADA</span>
                    <span class="badge badge-saida" th:if="${m.tipoMovimentacao() == 'SAIDA'}">SAÍDA</span>
                </td>
                <td th:text="${m.quantidade()}">1</td>
                <td th:text="${m.observacaoEvento() != null} ? ${m.observacaoEvento()} : '—'">—</td>
                <td th:text="${m.usuarioNome()}">Técnico</td>
            </tr>
            <tr th:if="${movimentacoes.isEmpty()}">
                <td colspan="6" class="vazio">Nenhuma movimentação registrada.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
