<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body class="login-body">
<main class="login-card">
    <h1 class="marca marca-grande">Arena<span>XP</span></h1>
    <p class="subtitulo">Algo deu errado</p>
    <div class="alerta alerta-erro" role="alert">
        <span th:text="${status != null} ? ('Erro ' + ${status}) : 'Erro inesperado'">Erro</span>
        — Não foi possível concluir a operação. Tente novamente ou volte ao início.
    </div>
    <a class="btn btn-primario btn-bloco" th:href="@{/}">Voltar ao início</a>
</main>
</body>
</html>
